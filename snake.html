<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>七彩貪食蛇遊戲</title>
    <style>
        body {
            background: linear-gradient(135deg, #FF6B6B, #FFD93D, #6BCB77, #4D96FF, #6B77FF, #FF6B6B);
            background-size: 600% 600%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #gameContainer {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        #scoreBoard {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        #score, #highScore {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 10px;
        }

        #canvasFrame {
            position: relative;
            padding: 8px;
            border-radius: 12px;
            background: linear-gradient(135deg, #FF6B6B, #FFD93D, #6BCB77, #4D96FF, #6B77FF, #FF6B6B);
            background-size: 400% 400%;
            animation: borderPulse 3s linear infinite;
        }

        @keyframes borderPulse {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        canvas {
            display: block;
            border-radius: 8px;
            background-color: #111;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        #levelIndicator {
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div id="scoreBoard">
            <span id="score">SCORE: 0</span>
            <span id="highScore">HIGH SCORE: 0</span>
        </div>
        <div id="canvasFrame">
            <canvas id="gameCanvas" width="500" height="500"></canvas>
        </div>
        <div id="levelIndicator">LEVEL: 1</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("highScore");
        const levelElement = document.getElementById("levelIndicator");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem("snakeHighScore") || 0;
        // 初始速度調整為 120ms (較慢)
        let gameSpeed = 120; 
        let gameStarted = false;
        let gameInterval;
        let foodColorIndex = 0;

        highScoreElement.innerText = "HIGH SCORE: " + highScore;

        const rainbowColors = ["#FF3333", "#FF9933", "#FFFF33", "#33FF33", "#3333FF", "#CC33FF"];

        function gameLoop() {
            update();
            draw();
        }

        function update() {
            if (!gameStarted) return;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount ||
                snake.some(part => part.x === head.x && part.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = "SCORE: " + score;
                placeFood();
                increaseSpeed();
                updateLevel();
            } else {
                snake.pop();
            }
        }

        function draw() {
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            foodColorIndex = (foodColorIndex + 1) % rainbowColors.length;
            ctx.fillStyle = rainbowColors[foodColorIndex];
            ctx.beginPath();
            ctx.arc((food.x + 0.5) * gridSize, (food.y + 0.5) * gridSize, gridSize / 2 * 0.8, 0, Math.PI * 2);
            ctx.fill();

            snake.forEach((part, index) => {
                const colorIndex = (index + Math.floor(score / 10)) % rainbowColors.length;
                ctx.fillStyle = rainbowColors[colorIndex];
                
                if (index === 0) {
                    ctx.beginPath();
                    ctx.arc((part.x + 0.5) * gridSize, (part.y + 0.5) * gridSize, gridSize / 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    const offset = 2;
                    ctx.beginPath();
                    drawRoundRect(ctx, part.x * gridSize + offset, part.y * gridSize + offset, gridSize - offset*2, gridSize - offset*2, 5);
                    ctx.fill();
                }
            });
        }

        function drawRoundRect(ctx, x, y, width, height, radius) {
            ctx.moveTo(x + radius, y);
            ctx.arcTo(x + width, y, x + width, y + height, radius);
            ctx.arcTo(x + width, y + height, x, y + height, radius);
            ctx.arcTo(x, y + height, x, y, radius);
            ctx.arcTo(x, y, x + width, y, radius);
            ctx.closePath();
        }

        function placeFood() {
            let valid = false;
            while (!valid) {
                food = { x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount) };
                valid = !snake.some(p => p.x === food.x && p.y === food.y);
            }
        }

        function increaseSpeed() {
            // 加速曲線放緩，每 50 分才提升一點速度
            if (score > 0 && score % 50 === 0 && gameSpeed > 40) {
                gameSpeed -= 5;
                clearInterval(gameInterval);
                gameInterval = setInterval(gameLoop, gameSpeed);
            }
        }

        function updateLevel() {
            levelElement.innerText = "LEVEL: " + (Math.floor(score / 50) + 1);
        }

        function gameOver() {
            gameStarted = false;
            clearInterval(gameInterval);
            if (score > highScore) {
                highScore = score;
                highScoreElement.innerText = "HIGH SCORE: " + highScore;
                localStorage.setItem("snakeHighScore", highScore);
            }
            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#fff";
            ctx.font = "bold 50px Segoe UI";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2);
            ctx.font = "20px Segoe UI";
            ctx.fillText("Final Score: " + score, canvas.width / 2, canvas.height / 2 + 40);
        }

        function restart() {
            snake = [{ x: 10, y: 10 }];
            dx = 0; dy = 0; score = 0; gameSpeed = 120; gameStarted = false;
            scoreElement.innerText = "SCORE: 0";
            updateLevel();
            placeFood();
            ctx.fillStyle = "#fff";
            ctx.font = "20px Segoe UI";
            ctx.textAlign = "center";
            ctx.fillText("Press Arrows to Start", canvas.width / 2, canvas.height / 2 + 80);
        }

        document.addEventListener("keydown", (e) => {
            if (!gameStarted && (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key))) {
                if (score > 0) restart();
                gameStarted = true;
                gameInterval = setInterval(gameLoop, gameSpeed);
            }
            if (e.key === "ArrowUp" && dy !== 1) { dx = 0; dy = -1; }
            else if (e.key === "ArrowDown" && dy !== -1) { dx = 0; dy = 1; }
            else if (e.key === "ArrowLeft" && dx !== 1) { dx = -1; dy = 0; }
            else if (e.key === "ArrowRight" && dx !== -1) { dx = 1; dy = 0; }
        });

        placeFood();
        draw();
    </script>
</body>
</html>
